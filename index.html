<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f35"><title>ASX Position Planner — Locked</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600..800,0..100,0..1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--dark:#102d27;--forest:#173f35;--mid:#33735b;--moss:#c7d7a2;--cream:#f6f3e8;--paper:#fffdf7;--line:#d9dfd5;--muted:#68736e;--bad:#a44941}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Manrope,sans-serif;background:radial-gradient(circle at 12% 0%,rgba(199,215,162,.36),transparent 28rem),var(--cream);color:#17221e}body{min-height:100vh}.gate{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 24px 70px rgba(16,45,39,.12)}.mark{width:52px;height:52px;margin-bottom:20px}.mark svg{width:100%;height:100%;fill:none;stroke:var(--forest);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.eyebrow{margin:0 0 8px;color:var(--mid);text-transform:uppercase;letter-spacing:.16em;font-size:.68rem;font-weight:700}h1{margin:0;font-family:Fraunces,serif;font-variation-settings:"WONK" 1,"SOFT" 75;font-size:clamp(2.5rem,10vw,4rem);line-height:.95;letter-spacing:-.05em;color:var(--forest)}p.copy{margin:17px 0 24px;color:var(--muted);line-height:1.65;font-size:.86rem}.field span{display:block;margin-bottom:8px;color:var(--muted);font-size:.72rem;font-weight:700}.input{display:flex;align-items:center;gap:8px;min-height:54px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:#fff}.input:focus-within{border-color:#75a988;box-shadow:0 0 0 4px rgba(117,169,136,.16)}input{width:100%;border:0;outline:0;background:transparent;font:700 1rem Manrope;color:#17221e}button{width:100%;margin-top:13px;border:0;border-radius:14px;padding:14px 16px;background:var(--forest);color:white;font:700 .82rem Manrope;cursor:pointer}.error{min-height:18px;margin:10px 2px 0;color:var(--bad);font-size:.72rem}.privacy{margin:20px 0 0;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.65rem;line-height:1.55}.app{display:none;width:100%;height:100vh;border:0;background:var(--cream)}body.unlocked .gate{display:none}body.unlocked .app{display:block}</style></head><body><section class="gate" id="gate"><div class="card"><div class="mark"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4 9 27h10l-7 11h24l-7-11h10L24 4Z"/><path d="M24 23v20"/></svg></div><p class="eyebrow">Brand Forest · private calculator</p><h1>Unlock your<br>ASX planner.</h1><p class="copy">Enter the access password to open your saved positions and calculator.</p><form id="login"><label class="field"><span>Password</span><div class="input"><input id="password" type="password" autocomplete="current-password" inputmode="numeric" autofocus></div></label><button type="submit">Unlock calculator</button><p class="error" id="error" role="alert"></p></form><p class="privacy">The plaintext password is not stored in this page. Your entry is SHA-256 hashed in your browser before comparison.</p></div></section><iframe class="app" id="app" title="ASX Position Planner"></iframe><script>const EXPECTED='2461f6570d5a5fc453248b2dc07f9888f15d748180dcbb2c35608d884ea40f62';const enc=new TextEncoder();async function sha256(v){const b=await crypto.subtle.digest('SHA-256',enc.encode(v));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function openApp(){document.body.classList.add('unlocked');const app=document.getElementById('app');if(!app.src)app.src='calculator.html'}if(sessionStorage.getItem('asxcalc-unlocked')==='1')openApp();document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password'),err=document.getElementById('error');err.textContent='';const got=await sha256(p.value);if(got===EXPECTED){sessionStorage.setItem('asxcalc-unlocked','1');p.value='';openApp()}else{err.textContent='Incorrect password.';p.select()}});</script></body></html>
